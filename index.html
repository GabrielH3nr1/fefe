<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛏️ Convite Minecraft</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --dirt: #8B5E3C;
      --dirt-dark: #5C3D1E;
      --grass: #5dac32;
      --grass-dark: #3d7a1f;
      --grass-light: #7acc4a;
      --stone: #9b9b9b;
      --wood: #a0742b;
      --sand: #e8d079;
      --diamond: #31CCCC;
      --diamond-dark: #1a9999;
      --gold: #E8C44A;
      --lava: #FF6B00;
      --sky: #78aee8;
      --sky-dark: #4a7fc4;
      --leaf: #3f9b28;
      --leaf2: #2d7318;
      --panel: rgba(20,12,4,0.85);
      --creeper-green: #5dac32;
      --block-size: 40px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      background: #1a0a00;
      overflow-x: hidden;
      min-height: 100vh;
      image-rendering: pixelated;
      color: #fff;
    }

    /* ── PARALLAX SKY WORLD ── */
    #world {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #sky-layer {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #1a1a3e 0%, #2a3a8c 30%, #78aee8 60%, #78aee8 100%);
      z-index: 0;
      transition: filter 2s;
    }

    /* Stars */
    .star {
      position: absolute;
      background: #fff;
      border-radius: 0;
      animation: twinkle var(--d,2s) infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: .2; transform: scale(1); }
      to   { opacity: 1;  transform: scale(1.4); }
    }

    /* Sun / Moon */
    #sun {
      position: absolute;
      width: 48px; height: 48px;
      background: #FFD700;
      box-shadow: 0 0 0 8px #FFA500;
      top: 12%; right: 18%;
      animation: sunPulse 3s infinite alternate;
      image-rendering: pixelated;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    }
    @keyframes sunPulse {
      from { box-shadow: 0 0 0 8px #FFA500; }
      to   { box-shadow: 0 0 0 16px #FFA50066; }
    }

    /* Clouds */
    .cloud {
      position: fixed;
      background: #fff;
      opacity: .85;
      animation: drift var(--speed,40s) linear infinite;
      image-rendering: pixelated;
      z-index: 1;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #fff;
    }
    @keyframes drift {
      from { transform: translateX(110vw); }
      to   { transform: translateX(-300px); }
    }

    /* Floating pixel blocks */
    .float-block {
      position: fixed;
      width: var(--block-size); height: var(--block-size);
      border: 3px solid rgba(0,0,0,.4);
      animation: floatUp var(--dur,8s) linear infinite;
      z-index: 2;
      image-rendering: pixelated;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: .9; }
      90%  { opacity: .9; }
      100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
    }

    /* ── TERRAIN ── */
    #terrain {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      z-index: 3;
    }
    .terrain-row {
      display: flex;
      position: absolute;
      left: 0; right: 0;
    }
    .terrain-row.grass-row { bottom: 80px; }
    .terrain-row.dirt-row  { bottom: 40px; }
    .terrain-row.stone-row { bottom: 0; }
    .terrain-block {
      flex: 1;
      height: 40px;
      border: 2px solid rgba(0,0,0,.3);
      image-rendering: pixelated;
    }
    .grass-block {
      background: linear-gradient(180deg, var(--grass) 35%, var(--dirt) 35%);
    }
    .dirt-block  { background: var(--dirt); }
    .stone-block { background: var(--stone); }

    /* Pixel tree */
    .tree {
      position: fixed;
      bottom: 118px;
      z-index: 4;
    }
    .tree-trunk {
      width: 24px; height: 40px;
      background: var(--wood);
      border: 2px solid #5a3b10;
      margin: 0 auto;
    }
    .tree-leaves {
      image-rendering: pixelated;
    }
    .tree-leaves div {
      margin: 0 auto;
      border: 2px solid var(--leaf2);
    }

    /* ── MAIN CARD ── */
    #main-card {
      position: relative;
      z-index: 10;
      width: min(95vw, 700px);
      margin: 60px auto 200px;
      background: rgba(16, 8, 2, 0.92);
      border: 5px solid var(--dirt-dark);
      box-shadow:
        0 0 0 3px var(--gold),
        8px 8px 0 rgba(0,0,0,.6);
      animation: cardIn .6s cubic-bezier(.17,.67,.37,1.3) both;
      backdrop-filter: blur(4px);
    }
    @keyframes cardIn {
      from { transform: scale(.7) translateY(-40px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Grass banner on top */
    .grass-banner {
      display: grid;
      grid-template-columns: repeat(auto-fill, 40px);
      height: 40px;
      overflow: hidden;
      border-bottom: 3px solid var(--dirt-dark);
    }
    .grass-banner-block {
      height: 40px;
      background: linear-gradient(180deg, var(--grass-light) 35%, var(--dirt) 35%);
      border-right: 2px solid rgba(0,0,0,.2);
    }

    .card-inner { padding: 28px 24px 32px; }

    /* ── CREEPER FACE (pixel art SVG) ── */
    #creeper-face {
      display: block;
      margin: 0 auto 20px;
      animation: creeperBob 1.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 12px #5dac3288);
    }
    @keyframes creeperBob {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-10px) scale(1.05); }
    }

    h1 {
      text-align: center;
      font-size: clamp(14px, 4vw, 22px);
      color: var(--grass-light);
      text-shadow: 3px 3px 0 #1a3d08, 0 0 20px #5dac3255;
      line-height: 1.6;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 10px;
      color: var(--diamond);
      margin-bottom: 24px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--diamond-dark);
    }

    /* HP bar style progress */
    .hp-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 auto 24px;
      max-width: 340px;
    }
    .hp-label { font-size: 8px; color: var(--grass); white-space: nowrap; }
    .hp-track {
      flex: 1; height: 16px;
      background: #1a0a00;
      border: 3px solid #5a3b10;
    }
    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #c0392b, #e74c3c 50%, #ff6b6b);
      width: 100%;
      transition: width .8s ease;
      position: relative;
    }
    .hp-fill::after {
      content: '';
      position: absolute;
      top: 2px; left: 4px; right: 4px;
      height: 3px;
      background: rgba(255,255,255,.25);
    }

    /* INVITATION TEXT */
    .invite-text {
      font-family: 'Courier New', monospace;
      font-size: clamp(13px, 2.5vw, 16px);
      color: #f0d090;
      line-height: 2;
      text-align: center;
      padding: 20px;
      background: rgba(255,255,255,.04);
      border: 3px solid var(--dirt-dark);
      margin-bottom: 28px;
      position: relative;
    }
    .invite-text::before {
      content: '❯❯ MISSÃO ❮❮';
      position: absolute;
      top: -12px; left: 50%;
      transform: translateX(-50%);
      background: #10080a;
      padding: 0 10px;
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 2px;
    }

    /* Typewriter cursor */
    .cursor {
      display: inline-block;
      width: 12px; height: 2px;
      background: #f0d090;
      animation: blink .7s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 14px 24px;
      border: 4px solid;
      cursor: pointer;
      position: relative;
      transition: transform .08s, box-shadow .08s;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-width: 130px;
    }
    .pixel-btn::after {
      content: '';
      position: absolute;
      right: -6px; bottom: -6px;
      width: 100%; height: 100%;
      z-index: -1;
    }
    .pixel-btn:hover { transform: translate(-2px,-2px); }
    .pixel-btn:active { transform: translate(2px,2px); box-shadow: none !important; }

    #yesBtn {
      background: var(--grass);
      color: #0a1f0a;
      border-color: var(--grass-dark);
      box-shadow: 6px 6px 0 var(--grass-dark);
    }
    #yesBtn::after { background: var(--grass-dark); }
    #yesBtn:hover { box-shadow: 8px 8px 0 var(--grass-dark); }

    #noBtn {
      background: #c0392b;
      color: #2b0000;
      border-color: #7b1a10;
      box-shadow: 6px 6px 0 #7b1a10;
      transition: left .25s ease, top .25s ease, transform .08s, box-shadow .08s;
    }
    #noBtn::after { background: #7b1a10; }

    /* ── FORM SECTION ── */
    #formArea {
      border-top: 4px dashed var(--dirt-dark);
      padding-top: 28px;
      margin-top: 8px;
      animation: slideDown .4s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-title {
      text-align: center;
      font-size: 12px;
      color: var(--gold);
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #5a3b10;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 8px; }

    label {
      font-size: 9px;
      color: var(--diamond);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    input[type="date"],
    input[type="time"],
    input[type="text"] {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 12px 10px;
      background: #1a0a00;
      border: 3px solid var(--dirt-dark);
      color: #f0d090;
      outline: none;
      width: 100%;
      transition: border-color .2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input:focus { border-color: var(--gold); }

    #nameInput { grid-column: 1 / -1; }

    #confirmBtn {
      background: var(--diamond-dark);
      color: #001a1a;
      border-color: #0d6666;
      box-shadow: 5px 5px 0 #0d6666;
      width: 100%;
      display: block;
      margin: 8px auto 0;
    }
    #confirmBtn::after { background: #0d6666; }
    #confirmBtn:hover { box-shadow: 7px 7px 0 #0d6666; }

    /* ── FINAL MESSAGE ── */
    #finalMessage {
      margin-top: 24px;
      padding: 20px;
      background: rgba(93,172,50,.12);
      border: 4px solid var(--grass-dark);
      color: #c0ff90;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.9;
      text-align: center;
      animation: pop .4s cubic-bezier(.17,.67,.37,1.3) both;
      position: relative;
    }
    #finalMessage .big-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }
    @keyframes pop {
      from { transform: scale(.8); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    /* ── XP BAR ── */
    .xp-row {
      display: flex; align-items: center;
      gap: 8px; margin-top: 16px;
    }
    .xp-label { font-size: 8px; color: #8cde50; white-space: nowrap; }
    .xp-track {
      flex: 1; height: 10px;
      background: #1a0a00;
      border: 2px solid #3a3a20;
    }
    .xp-fill {
      height: 100%;
      background: #8cde50;
      width: 0;
      transition: width 1.5s ease 0.5s;
    }

    /* ── BOTTOM HOTBAR ── */
    #hotbar {
      position: fixed;
      bottom: 130px;
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px;
      z-index: 20;
      pointer-events: none;
    }
    .hotbar-slot {
      width: 44px; height: 44px;
      background: rgba(80,50,20,.7);
      border: 3px solid #8B6914;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      transition: transform .2s;
    }
    .hotbar-slot.active {
      border-color: #fff;
      background: rgba(120,80,30,.8);
    }

    /* ── CANVAS CONFETTI ── */
    #confetti-canvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    /* ── PIXEL RAIN (diamonds) ── */
    #diamond-rain {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }
    .dia {
      position: absolute;
      top: -60px;
      font-size: 24px;
      animation: rainFall linear infinite;
      opacity: 0;
    }
    @keyframes rainFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: .9; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ── AMBIENT PARTICLES ── */
    .particle {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 0;
      pointer-events: none;
      z-index: 5;
      animation: particleDrift var(--pd, 6s) ease-in-out infinite;
    }
    @keyframes particleDrift {
      0%,100% { transform: translate(0,0); opacity: .5; }
      50% { transform: translate(var(--px,20px), var(--py,-30px)); opacity: 1; }
    }

    /* ── TOAST NOTIFICATION ── */
    #toast {
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1a0a00;
      border: 3px solid var(--gold);
      padding: 12px 20px;
      font-size: 10px;
      color: var(--gold);
      z-index: 200;
      transition: transform .4s ease;
      white-space: nowrap;
      box-shadow: 0 4px 0 #5a3b10;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── ACHIEVEMENT ── */
    #achievement {
      position: fixed;
      top: 20px; right: -400px;
      background: rgba(10,5,0,.95);
      border: 3px solid var(--gold);
      padding: 14px 18px;
      z-index: 201;
      transition: right .5s cubic-bezier(.17,.67,.37,1.2);
      max-width: 280px;
      box-shadow: -4px 4px 0 #5a3b10;
    }
    #achievement.show { right: 16px; }
    .ach-title { font-size: 8px; color: var(--gold); letter-spacing: 2px; margin-bottom: 6px; }
    .ach-name  { font-size: 11px; color: #fff; }
    .ach-desc  { font-size: 9px; color: #aaa; margin-top: 4px; font-family: 'Courier New', monospace; }

    /* ── LOADING SCREEN ── */
    #loading {
      position: fixed; inset: 0;
      background: #1a0a00;
      z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      transition: opacity .6s ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    .load-bar-wrap {
      width: 300px; max-width: 90vw;
      height: 20px;
      background: #0a0500;
      border: 3px solid #5a3b10;
    }
    .load-bar {
      height: 100%;
      background: var(--grass);
      width: 0;
      transition: width .1s linear;
    }
    .load-text {
      font-size: 10px;
      color: #f0d090;
      letter-spacing: 1px;
    }

    /* ── NIGHT MODE OVERLAY ── */
    #night {
      position: fixed; inset: 0;
      background: rgba(0,0,5,.65);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s;
    }

    /* ── MISC ── */
    .hidden { display: none !important; }
    .pixel-divider {
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--dirt-dark) 0 10px, transparent 10px 14px);
      margin: 20px 0;
    }
    .fun-fact {
      font-size: 9px;
      color: #888;
      text-align: center;
      font-family: 'Courier New', monospace;
      padding: 8px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <!-- Loading screen -->
  <div id="loading">
    <div style="font-size:16px;color:var(--grass-light);text-shadow:3px 3px 0 #1a3d08;letter-spacing:2px;">
      ⛏️ GERANDO MUNDO...
    </div>
    <div class="load-bar-wrap"><div class="load-bar" id="loadBar"></div></div>
    <div class="load-text" id="loadText">Plantando árvores...</div>
  </div>

  <!-- Night overlay -->
  <div id="night"></div>

  <!-- Sky + stars -->
  <div id="sky-layer">
    <div id="sun"></div>
  </div>

  <!-- Toast notification -->
  <div id="toast">📦 Item coletado!</div>

  <!-- Achievement popup -->
  <div id="achievement">
    <div class="ach-title">⭐ CONQUISTA DESBLOQUEADA</div>
    <div class="ach-name" id="achName">Aventureiro Corajoso!</div>
    <div class="ach-desc" id="achDesc">Você aceitou a missão.</div>
  </div>

  <!-- Diamond rain container -->
  <div id="diamond-rain"></div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Hotbar -->
  <div id="hotbar">
    <div class="hotbar-slot active">⛏️</div>
    <div class="hotbar-slot">💎</div>
    <div class="hotbar-slot">🌱</div>
    <div class="hotbar-slot">🗡️</div>
    <div class="hotbar-slot">🍎</div>
    <div class="hotbar-slot">🧱</div>
    <div class="hotbar-slot">🪓</div>
    <div class="hotbar-slot">🔦</div>
    <div class="hotbar-slot">🗺️</div>
  </div>

  <!-- Terrain -->
  <div id="terrain">
    <div class="terrain-row stone-row" id="stoneRow"></div>
    <div class="terrain-row dirt-row"  id="dirtRow"></div>
    <div class="terrain-row grass-row" id="grassRow"></div>
  </div>

  <!-- Main world -->
  <div id="world">
    <!-- Main card -->
    <main id="main-card">
      <!-- Grass banner -->
      <div class="grass-banner" id="grassBanner"></div>

      <div class="card-inner">
        <!-- Creeper SVG face -->
        <svg id="creeper-face" width="80" height="100" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="80" height="80" fill="#5dac32"/>
          <rect x="4"  y="4"  width="72" height="4"  fill="#7acc4a"/>
          <!-- Eyes -->
          <rect x="16" y="24" width="14" height="14" fill="#1a0a00"/>
          <rect x="50" y="24" width="14" height="14" fill="#1a0a00"/>
          <!-- Mouth -->
          <rect x="28" y="46" width="24" height="6"  fill="#1a0a00"/>
          <rect x="22" y="52" width="10" height="8"  fill="#1a0a00"/>
          <rect x="48" y="52" width="10" height="8"  fill="#1a0a00"/>
          <rect x="28" y="60" width="24" height="6"  fill="#1a0a00"/>
          <!-- Legs hint -->
          <rect x="10" y="82" width="22" height="16" fill="#4a9a28"/>
          <rect x="48" y="82" width="22" height="16" fill="#4a9a28"/>
        </svg>

        <h1>🌎 CONVITE MINECRAFT 🌎</h1>
        <div class="subtitle">◇ SURVIVAL MODE ATIVADO ◇</div>

        <!-- HP bar -->
        <div class="hp-bar">
          <span class="hp-label">❤️ HP</span>
          <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
          <span class="hp-label">10/10</span>
        </div>

        <!-- Invitation text (typewriter) -->
        <div class="invite-text">
          <div id="typeTarget"></div><span class="cursor" id="cursor"></span>
        </div>

        <!-- Fun fact -->
        <div class="fun-fact" id="funFact">💡 Carregando curiosidade...</div>

        <div class="pixel-divider"></div>

        <!-- Buttons -->
        <div class="btn-row">
          <button class="pixel-btn" id="yesBtn">✅ SIM! 💎</button>
          <button class="pixel-btn" id="noBtn">❌ NÃO 🧨</button>
        </div>

        <!-- FORM (hidden initially) -->
        <div id="formArea" class="hidden">
          <div class="form-title">🎉 MUNDO CRIADO COM SUCESSO!</div>

          <div class="form-grid">
            <div class="form-group" id="nameInput">
              <label>👤 Seu nome de jogador</label>
              <input type="text" id="nameVal" placeholder="Steve..." maxlength="16" />
            </div>
            <div class="form-group">
              <label>📅 Data da aventura</label>
              <input type="date" id="dateVal" />
            </div>
            <div class="form-group">
              <label>⏰ Hora do encontro</label>
              <input type="time" id="timeVal" />
            </div>
          </div>

          <div class="xp-row">
            <span class="xp-label">XP</span>
            <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
          </div>

          <br/>
          <button class="pixel-btn" id="confirmBtn">⚔️ CONFIRMAR AVENTURA</button>

          <div id="finalMessage"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
  (() => {
    /* ── LOADING SCREEN ── */
    const steps = ['Plantando árvores...','Gerando cavernas...','Spawnando mobs...','Construindo mundo...','Quase pronto...'];
    let pct = 0;
    const loadBar = document.getElementById('loadBar');
    const loadTxt = document.getElementById('loadText');
    const loading = document.getElementById('loading');
    function tick() {
      pct += Math.random() * 18 + 6;
      if (pct > 100) pct = 100;
      loadBar.style.width = pct + '%';
      loadTxt.textContent = steps[Math.min(Math.floor(pct/22), steps.length-1)];
      if (pct < 100) setTimeout(tick, 200 + Math.random()*200);
      else setTimeout(() => { loading.classList.add('fade'); setTimeout(() => loading.remove(), 700); }, 400);
    }
    setTimeout(tick, 300);

    /* ── BUILD TERRAIN ── */
    const cols = Math.ceil(window.innerWidth / 42) + 2;
    document.getElementById('grassRow').innerHTML = Array(cols).fill('<div class="terrain-block grass-block"></div>').join('');
    document.getElementById('dirtRow').innerHTML  = Array(cols).fill('<div class="terrain-block dirt-block"></div>').join('');
    document.getElementById('stoneRow').innerHTML = Array(cols).fill('<div class="terrain-block stone-block"></div>').join('');

    /* ── GRASS BANNER ── */
    const bannerCols = Math.ceil(700 / 42) + 2;
    document.getElementById('grassBanner').innerHTML = Array(bannerCols).fill('<div class="grass-banner-block"></div>').join('');

    /* ── STARS ── */
    const sky = document.getElementById('sky-layer');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const sz = Math.random() < .3 ? 4 : 2;
      s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*45}%;--d:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
      sky.appendChild(s);
    }

    /* ── CLOUDS ── */
    const cloudDefs = [
      {top:'8%',h:28,speed:'55s',delay:'-10s'},
      {top:'15%',h:22,speed:'40s',delay:'-25s'},
      {top:'22%',h:18,speed:'65s',delay:'-40s'},
    ];
    cloudDefs.forEach(c => {
      const el = document.createElement('div');
      el.className = 'cloud';
      const w = 80 + Math.random()*80;
      el.style.cssText = `top:${c.top};height:${c.h}px;width:${w}px;--speed:${c.speed};animation-delay:${c.delay}`;
      el.style.borderRadius = '0';
      document.body.appendChild(el);
    });

    /* ── FLOATING BLOCKS ── */
    const blockColors = ['#8B5E3C','#5dac32','#9b9b9b','#a0742b','#e8d079','#31CCCC','#E8C44A'];
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'float-block';
      b.style.cssText = `background:${blockColors[i%blockColors.length]};left:${Math.random()*100}%;--dur:${8+Math.random()*12}s;animation-delay:-${Math.random()*12}s;opacity:.4`;
      document.body.appendChild(b);
    }

    /* ── AMBIENT PARTICLES ── */
    const pColors = ['#5dac32','#31CCCC','#E8C44A','#FF6B00'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `background:${pColors[i%4]};left:${Math.random()*100}%;top:${Math.random()*80}%;--pd:${4+Math.random()*6}s;animation-delay:-${Math.random()*6}s;--px:${(Math.random()-.5)*40}px;--py:${-20-Math.random()*40}px`;
      document.body.appendChild(p);
    }

    /* ── TREES ── */
    [[8,80],[85,100],[65,70],[20,60]].forEach(([left,height]) => {
      const t = document.createElement('div');
      t.className = 'tree';
      t.style.left = left + '%';
      const leafSizes = [56,80,56];
      const leafMgns  = [12,0,6];
      t.innerHTML = `<div class="tree-leaves">
        ${leafSizes.map((w,i)=>`<div style="width:${w}px;height:${w/2}px;background:${i%2?'#3f9b28':'#57bc3a'};margin-bottom:-2px;margin-left:${(80-w)/2}px"></div>`).join('')}
      </div><div class="tree-trunk"></div>`;
      document.body.appendChild(t);
    });

    /* ── TYPEWRITER ── */
    const msg = `Você aceita criar um mundo comigo?\nConstruir uma casinha fofa, minerar diamantes\ne juntos derrotar o Dragão do Fim? 🐉`;
    const target = document.getElementById('typeTarget');
    const cursor = document.getElementById('cursor');
    let idx = 0;
    function type() {
      if (idx < msg.length) {
        const ch = msg[idx++];
        if (ch === '\n') { target.innerHTML += '<br/>'; }
        else { target.innerHTML += ch === '🐉' ? '🐉' : ch; }
        setTimeout(type, ch === '\n' ? 200 : 35 + Math.random()*20);
      } else {
        cursor.style.display = 'none';
      }
    }
    setTimeout(type, 1800);

    /* ── FUN FACTS ── */
    const facts = [
      '💡 O Creeper surgiu de um bug no código do porco!',
      '💡 Diamantes são encontrados entre os níveis 1 e 16.',
      '💡 O Enderman tem medo de água — igual a mim sem você! 💚',
      '💡 Um Creeper explode depois de 1.5 segundos de hissing.',
      '💡 O Dragão do Fim tem 200 HP — mas nossa amizade tem ∞!',
    ];
    let fi = 0;
    document.getElementById('funFact').textContent = facts[0];
    setInterval(() => {
      fi = (fi+1) % facts.length;
      const el = document.getElementById('funFact');
      el.style.opacity = 0;
      setTimeout(() => { el.textContent = facts[fi]; el.style.opacity = 1; }, 400);
    }, 5000);
    document.getElementById('funFact').style.transition = 'opacity .4s';

    /* ── DAY/NIGHT CYCLE ── */
    let nightMode = false;
    function toggleNight() {
      nightMode = !nightMode;
      document.getElementById('night').style.opacity = nightMode ? 1 : 0;
      document.getElementById('sky-layer').style.filter = nightMode ? 'brightness(.35) saturate(.4)' : 'brightness(1) saturate(1)';
      document.getElementById('sun').style.background = nightMode ? '#aaaacc' : '#FFD700';
      document.getElementById('sun').style.boxShadow = nightMode ? '0 0 0 8px #8888aa' : '0 0 0 8px #FFA500';
    }
    setInterval(toggleNight, 30000);

    /* ── TOAST ── */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    /* ── ACHIEVEMENT ── */
    function showAchievement(name, desc) {
      document.getElementById('achName').textContent = name;
      document.getElementById('achDesc').textContent = desc;
      const a = document.getElementById('achievement');
      a.classList.add('show');
      setTimeout(() => a.classList.remove('show'), 4000);
    }

    /* ── CONFETTI ── */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let pieces = [];
    function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const confColors = ['#58c957','#3fa33f','#31CCCC','#E8C44A','#e74c3c','#f0d090','#fff'];
    function launchConfetti(n = 200) {
      for (let i = 0; i < n; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height * .5,
          size: Math.random() * 10 + 4,
          speed: Math.random() * 5 + 2,
          vx: (Math.random() - .5) * 3,
          rot: Math.random() * 360,
          rotS: Math.random() * 10 - 5,
          color: confColors[Math.floor(Math.random() * confColors.length)],
          shape: Math.random() < .4 ? 'diamond' : 'square',
        });
      }
      requestAnimationFrame(animConf);
    }
    function animConf() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.speed; p.x += p.vx; p.rot += p.rotS;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        if (p.shape === 'diamond') {
          ctx.beginPath();
          ctx.moveTo(0, -p.size); ctx.lineTo(p.size*.6, 0);
          ctx.lineTo(0, p.size);  ctx.lineTo(-p.size*.6, 0);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        }
        ctx.restore();
      });
      pieces = pieces.filter(p => p.y < canvas.height + 50);
      if (pieces.length) requestAnimationFrame(animConf);
    }

    /* ── DIAMOND RAIN ── */
    function diamondRain(count = 30) {
      const c = document.getElementById('diamond-rain');
      for (let i = 0; i < count; i++) {
        const d = document.createElement('div');
        d.className = 'dia';
        d.textContent = ['💎','⛏️','🌟','💚'][Math.floor(Math.random()*4)];
        d.style.left = Math.random() * 100 + 'vw';
        d.style.animationDuration = (1.5 + Math.random()*2) + 's';
        d.style.animationDelay = (Math.random()*2) + 's';
        d.style.fontSize = (16 + Math.random()*20) + 'px';
        c.appendChild(d);
        setTimeout(() => d.remove(), 5000);
      }
    }

    /* ── NO BUTTON ESCAPE ── */
    const noBtn = document.getElementById('noBtn');
    let noClickCount = 0;
    const noTaunts = [
      '🏃 Muito lento!','🌋 Impossível escapar!','💨 Whoosh!',
      '😈 Ha ha ha!','🐢 Mais rápido!','🌀 Desviei!','⚡ Tá na mão!'
    ];
    function escapeNo() {
      noClickCount++;
      noBtn.style.position = 'fixed';
      noBtn.style.zIndex = '50';
      const pad = 30;
      const maxX = innerWidth - noBtn.offsetWidth - pad;
      const maxY = innerHeight - noBtn.offsetHeight - pad;
      noBtn.style.left = (Math.random() * (maxX - pad) + pad) + 'px';
      noBtn.style.top  = (Math.random() * (maxY - pad) + pad) + 'px';
      noBtn.textContent = noTaunts[(noClickCount-1) % noTaunts.length];
      showToast('❌ O botão fugiu! Tente de novo...');
      if (noClickCount === 5) showAchievement('Persistente!', 'Tentou 5x clicar no "Não"');
      if (noClickCount === 10) {
        showAchievement('Insistente Demais!', 'Deu 10 tentativas... diz sim logo!');
        noBtn.style.transition = 'left 0s, top 0s';
        noBtn.style.opacity = '0.15';
      }
    }
    noBtn.addEventListener('mouseenter', escapeNo);
    noBtn.addEventListener('touchstart', e => { e.preventDefault(); escapeNo(); });
    noBtn.addEventListener('click', e => { e.preventDefault(); escapeNo(); });

    /* ── YES BUTTON ── */
    document.getElementById('yesBtn').addEventListener('click', () => {
      const formArea = document.getElementById('formArea');
      formArea.classList.remove('hidden');
      formArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      launchConfetti(150);
      diamondRain(20);
      showAchievement('Aventureiro! 💚', 'Você aceitou a missão!');
      showToast('💚 SIM! Mundo criado com sucesso!');
      document.getElementById('yesBtn').textContent = '✅ ACEITO! 💚';
      document.getElementById('yesBtn').style.animation = 'sunPulse .5s 4';
      // XP bar fill
      setTimeout(() => { document.getElementById('xpFill').style.width = '100%'; }, 100);
      // Hotbar update
      document.querySelectorAll('.hotbar-slot').forEach((s,i) => {
        s.classList.toggle('active', i === 1);
      });
    });

    /* ── CONFIRM BUTTON ── */
    document.getElementById('confirmBtn').addEventListener('click', () => {
      const name = document.getElementById('nameVal').value.trim() || 'Aventureiro';
      const date = document.getElementById('dateVal').value;
      const time = document.getElementById('timeVal').value;
      if (!date || !time) {
        showToast('⚠️ Preencha a data e a hora, aventureiro!');
        return;
      }
      const fmt = new Date(date+'T00:00:00').toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});
      document.getElementById('finalMessage').innerHTML = `
        <span class="big-icon">🐉⚔️💎</span>
        <strong style="color:#E8C44A;font-size:14px;">AVENTURA CONFIRMADA, ${name.toUpperCase()}!</strong><br/><br/>
        No dia <span style="color:#31CCCC">${fmt}</span><br/>
        às <span style="color:#31CCCC">${time}</span><br/><br/>
        Vamos construir nossa casa, minerar diamantes<br/>
        e juntos derrotar o Dragão do Fim! 🌍💚<br/><br/>
        <span style="font-size:10px;color:#888">Seed do mundo: ${Math.floor(Math.random()*9999999)}</span>
      `;
      launchConfetti(300);
      diamondRain(40);
      showAchievement('Missão Aceita! 🏆', 'A aventura está confirmada!');
      showToast('🎉 Aventura confirmada! Até lá!');
      // Day/night final flash
      setTimeout(toggleNight, 1000);
      setTimeout(toggleNight, 2500);
    });

    /* ── CLICK ANYWHERE EASTER EGG ── */
    let clickCount = 0;
    document.addEventListener('click', e => {
      if (e.target.closest('button') || e.target.closest('input')) return;
      clickCount++;
      if (clickCount % 15 === 0) {
        showToast(['🌟 Encontrou um diamante!','🍎 Comeu uma maçã!','🦆 Ouviu um pato...','⚡ Relâmpago!'][Math.floor(Math.random()*4)]);
      }
    });

    /* ── KONAMI CODE EASTER EGG ── */
    const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    let ki = 0;
    document.addEventListener('keydown', e => {
      if (e.key === konami[ki]) { ki++; if (ki === konami.length) { ki=0; launchConfetti(500); diamondRain(60); showAchievement('HACKER 🎮','Código Konami ativado!'); } }
      else ki = 0;
    });

  })();
  </script>
</body>
</html>
